name: Bug report
description: Report reproducible behavior that does not match Grasp's documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to help improve Grasp. Do not include API keys or private source code.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: Include the smallest safe example you can share.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grasp version or commit
      placeholder: "grasp --version or git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 24.2.0, Terminal.app"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized output
      description: Remove paths, source code, diffs, and credentials before pasting logs.
      render: shell
